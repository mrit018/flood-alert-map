name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ให้สิทธิ์เขียนเฉพาะตอน deploy เท่านั้น
permissions:
  contents: read
  pages: write
  id-token: write

# ยกเลิกการ deploy ค้างจากรอบก่อนหน้า ถ้ามีรอบใหม่เข้ามา
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/upload-pages-artifact ไม่มีอินพุต exclude
      # จึงต้องเลือกเฉพาะไฟล์เว็บที่ต้องการไปยัง _site ก่อน
      - name: เตรียมไฟล์เว็บ
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll _site/
          test -f _site/index.html || { echo "ไม่พบ index.html"; exit 1; }
          echo "เตรียมไฟล์แล้ว: $(ls _site | tr '\n' ' ') ($(wc -c < _site/index.html) bytes)"

      - name: ตั้งค่า Pages
        uses: actions/configure-pages@v5
        with:
          # ถ้า repo ยังไม่เคยเปิด Pages ให้ action เปิดให้เองแบบ build_type=workflow
          # (ถ้าเปิดไว้แล้ว ค่านี้ไม่มีผล — ปลอดภัย)
          enablement: true

      - name: อัปโหลดไฟล์เว็บไปยัง artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: deploy ขึ้น GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
