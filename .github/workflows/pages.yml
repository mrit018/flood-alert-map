name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# ให้สิทธิ์เขียนเฉพาะตอน deploy เท่านั้น
permissions:
  contents: read
  pages: write
  id-token: write

# ยกเลิกการ deploy ค้างจากรอบก่อนหน้า ถ้ามีรอบใหม่เข้ามา
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # ตรึงเวอร์ชัน image: ubuntu-latest กำลังจะย้ายไป Ubuntu 26
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # actions/upload-pages-artifact ไม่มีอินพุต exclude
      # จึงต้องเลือกเฉพาะไฟล์เว็บที่ต้องการไปยัง _site ก่อน
      - name: เตรียมไฟล์เว็บ
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll _site/
          test -f _site/index.html || { echo "ไม่พบ index.html"; exit 1; }
          echo "เตรียมไฟล์แล้ว: $(ls -A _site | tr '\n' ' ') ($(wc -c < _site/index.html) bytes)"

      - name: ตั้งค่า Pages
        uses: actions/configure-pages@v6
        with:
          # พยายามเปิด Pages ให้เอง (build_type=workflow) ถ้ายังไม่ได้เปิด
          # ถ้า token สร้างไม่ได้ (เช่น repo private บนแผนที่ไม่รองรับ)
          # ให้เปิดเองที่ Settings -> Pages -> Source: GitHub Actions แล้ว run ซ้ำ
          enablement: true

      - name: อัปโหลดไฟล์เว็บไปยัง artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: deploy ขึ้น GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
